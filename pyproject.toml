[project]
name = "spectrometer-lab"
version = "0.1.0"
description = "RS-232 control and acquisition toolkit for a PerkinElmer LS 55 fluorescence spectrometer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ls55"]

[tool.pytest.ini_options]
testpaths = ["tests"]
